<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SellYou - Freelance Services Marketplace</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="container">
                <h1 class="logo">SellYou</h1>
                <ul class="nav-links">
                    <li><a href="#home">Home</a></li>
                    <li><a href="#search">Search Freelancers</a></li>
                    <li><a href="#login">Login</a></li>
                    <li><a href="#signup">Sign Up</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <section id="hero" class="hero">
            <div class="container">
                <h2>Find Your Perfect Freelancer</h2>
                <p>Connect with talented creatives for your business needs</p>
                <button class="btn btn-primary">Get Started</button>
            </div>
        </section>

        <section id="search" class="search">
            <div class="container">
                <h2>Search by Service Type</h2>
                <input type="text" id="searchInput" placeholder="e.g., graphic design, copywriting, web development...">
                <button class="btn btn-primary">Search</button>
                <div id="results" class="results"></div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SellYou. All rights reserved.</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
